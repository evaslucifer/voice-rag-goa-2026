services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-rag-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: voice-rag-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped
